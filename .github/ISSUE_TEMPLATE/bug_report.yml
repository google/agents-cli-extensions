name: 'Bug Report'
description: 'Report a bug in an Agents CLI extension'
labels: ['bug']
body:
  - type: 'markdown'
    attributes:
      value: |-
        > [!IMPORTANT]
        > Thanks for taking the time to fill out this bug report!
        >
        > Please search **[existing issues](https://github.com/google/agents-cli-extensions/issues)** first. Bugs in `agents-cli` itself belong in the [Agents CLI repository](https://github.com/google/agents-cli/issues).

  - type: 'input'
    id: 'extension'
    attributes:
      label: 'Extension'
      description: 'Which extension is affected?'
      placeholder: 'langchain'
    validations:
      required: true

  - type: 'textarea'
    id: 'problem'
    attributes:
      label: 'What happened?'
      description: 'A clear and concise description of what the bug is.'
    validations:
      required: true

  - type: 'textarea'
    id: 'repro'
    attributes:
      label: 'Steps to Reproduce'
      description: 'Please provide the exact steps to reproduce the behavior.'
      placeholder: |-
        1. Run `agents-cli create my-agent --agent google/agents-cli-extensions/core/langchain/template`
        2. Modify `...`
        3. Run `agents-cli run "..."`
        4. See error `...`
    validations:
      required: true

  - type: 'textarea'
    id: 'expected'
    attributes:
      label: 'What did you expect to happen?'
    validations:
      required: true

  - type: 'textarea'
    id: 'info'
    attributes:
      label: 'Client information'
      description: 'Please paste the full text from `agents-cli info`, run inside the project.'
      value: |-
        <details>
        <summary>Client Information</summary>

        Run `agents-cli info` to output debugging information about your client and active extensions.

        </details>
    validations:
      required: true

  - type: 'textarea'
    id: 'logs'
    attributes:
      label: 'Command Output / Logs'
      description: 'Paste the full output of the command that failed.'
    validations:
      required: false

  - type: 'textarea'
    id: 'additional-context'
    attributes:
      label: 'Anything else we need to know?'
      description: 'Add any other context about the problem here.'
