# The PyPI package agents-cli installs extensions from, plus the dev tooling for this repo.
[project]
name = "google-agents-cli-extensions"
version = "1.14.2"
requires-python = ">=3.11"
description = "Extensions for agents-cli, installed with `agents-cli extension add pypi@agents-cli-extensions`."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Google LLC" }]

[project.urls]
Homepage = "https://github.com/google/agents-cli-extensions"
Issues = "https://github.com/google/agents-cli-extensions/issues"

# Without a build backend, uv falls back to setuptools, which ships only the
# Python packages it discovers and drops agents-cli-extension.yaml, uv.lock, etc.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# agents-cli installs an extension from this wheel without running it:
# `pypi@agents-cli-extensions==X.Y.Z#core/<name>/template`. The wheel keeps the
# repo's core/ layout at its root, so the selector matches the git reference
# `google/agents-cli-extensions#core/<name>/template`. It is not meant for pip.
[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
only-include = ["core"]
# Repo contract tests run against this checkout, not an installed extension.
exclude = ["core/*/tests"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
only-include = ["core", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    # The contract tests parse manifests and scaffold templates with the CLI itself.
    "google-agents-cli>=1.14.0,<2",
    "pytest>=9.0.2",
    "jsonschema>=4.20",
    "pyyaml>=6.0.2",
    "ruff>=0.15",
]

[tool.uv]
# `make install` sets up the dev tooling only; `uv build` still builds the wheel.
package = false

[tool.pytest.ini_options]
# Each template's own tests/ belong to the generated project, not this repo.
testpaths = ["core/*/tests", "tools/*/tests"]

[tool.ruff]
line-length = 90
target-version = "py311"
# Templates are generated-project code, linted at their own config by `make lint-templates`.
extend-exclude = ["core/*/template"]

[tool.ruff.lint]
preview = true
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff specific rules
    "unspecified-encoding", # require encoding in open calls
]
ignore = ["line-too-long", "complex-structure"]
